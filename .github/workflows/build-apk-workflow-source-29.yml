name: DongBaKe Android build - source-29 CPU + Vulkan multi-ABI

on:
  push:
    branches: [main, "work/source-29-phase1"]
    paths:
      - ".github/workflows/build-apk-workflow-source-29.yml"
      - ".github/scripts/patch-source-29.py.xz.b64.part-*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_CMAKE_VERSION: '3.22.1'
  LLAMA_CPP_TAG: 'v0.6.0'

jobs:
  prepare-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create source-29 archive from source-28 with guarded patches
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$GITHUB_WORKSPACE/buildsrc"
          mkdir -p "$GITHUB_WORKSPACE/buildsrc"
          test -f "$GITHUB_WORKSPACE/DongBaKe-source-28.zip"
          unzip -t "$GITHUB_WORKSPACE/DongBaKe-source-28.zip"
          unzip -q "$GITHUB_WORKSPACE/DongBaKe-source-28.zip" -d "$GITHUB_WORKSPACE/buildsrc"
          cat "$GITHUB_WORKSPACE"/.github/scripts/patch-source-29.py.xz.b64.part-* | base64 --decode | xz -dc > "$RUNNER_TEMP/patch-source-29.py"
          python3 "$RUNNER_TEMP/patch-source-29.py" "$GITHUB_WORKSPACE/buildsrc"
          grep -q 'applicationId = "com.aiguanjia.app"' "$GITHUB_WORKSPACE/buildsrc/app/build.gradle.kts"
          grep -q 'versionCode = 29' "$GITHUB_WORKSPACE/buildsrc/app/build.gradle.kts"
          grep -q 'versionName = "0.10.7"' "$GITHUB_WORKSPACE/buildsrc/app/build.gradle.kts"
          rm -f "$GITHUB_WORKSPACE/DongBaKe-source-29.zip"
          (cd "$GITHUB_WORKSPACE/buildsrc" && zip -qr "$GITHUB_WORKSPACE/DongBaKe-source-29.zip" .)
          unzip -t "$GITHUB_WORKSPACE/DongBaKe-source-29.zip"
          sha256sum "$GITHUB_WORKSPACE/DongBaKe-source-29.zip" | tee "$GITHUB_WORKSPACE/source-29-sha256.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DongBaKe-source-29.zip
          if git diff --cached --quiet; then
            echo "Source-29 archive is already identical to the checked-out revision."
          else
            git commit -m "Create DongBaKe source-29 with inference controls and engine compatibility updates"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
          SOURCE_ARCHIVE_COMMIT="$(git rev-parse HEAD)"
          {
            echo "sourceVersion=28"
            echo "versionCode=29"
            echo 'versionName=0.10.7'
            echo "sourceArchiveCommit=${SOURCE_ARCHIVE_COMMIT}"
            sha256sum "$GITHUB_WORKSPACE/DongBaKe-source-29.zip"
          } > "$GITHUB_WORKSPACE/source-29-provenance.txt"

      - name: Upload exact source archive and provenance
        uses: actions/upload-artifact@v4
        with:
          name: DongBaKe-source-29-src-run-${{ github.run_number }}
          path: |
            DongBaKe-source-29.zip
            source-29-provenance.txt
          if-no-files-found: error
          retention-days: 14

  build:
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download exact source-29 archive
        uses: actions/download-artifact@v4
        with:
          name: DongBaKe-source-29-src-run-${{ github.run_number }}
          path: source-input

      - name: Verify and extract source
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f "$GITHUB_WORKSPACE/source-input/DongBaKe-source-29.zip"
          mkdir -p "$GITHUB_WORKSPACE/buildsrc"
          unzip -t "$GITHUB_WORKSPACE/source-input/DongBaKe-source-29.zip"
          unzip -q "$GITHUB_WORKSPACE/source-input/DongBaKe-source-29.zip" -d "$GITHUB_WORKSPACE/buildsrc"
          test -f "$GITHUB_WORKSPACE/buildsrc/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/buildsrc/app/build.gradle.kts"
          grep -q 'versionCode = 29' "$GITHUB_WORKSPACE/buildsrc/app/build.gradle.kts"
          grep -q 'versionName = "0.10.7"' "$GITHUB_WORKSPACE/buildsrc/app/build.gradle.kts"
          grep -q 'abiFilters += listOf("arm64-v8a", "x86_64")' "$GITHUB_WORKSPACE/buildsrc/app/build.gradle.kts"
          mkdir -p "$GITHUB_WORKSPACE/buildsrc/build/source-29-validation"
          cp "$GITHUB_WORKSPACE/source-input/source-29-provenance.txt" "$GITHUB_WORKSPACE/buildsrc/build/source-29-validation/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, NDK, CMake and Vulkan build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers libvulkan-dev ninja-build zip unzip
          test -f "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"
          command -v glslc
          command -v ninja

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run source and parser tests
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-29-validation
          python3 -m unittest discover -s tests -v 2>&1 | tee build/source-29-validation/python-tests.log
          bash tools/test_model_profile.sh 2>&1 | tee build/source-29-validation/model-profile-tests.log
          bash tools/test_math_parser.sh 2>&1 | tee build/source-29-validation/math-parser-tests.log
          bash tools/test_source_audit.sh 2>&1 | tee build/source-29-validation/source-audit-tests.log
          bash -n tools/build_llama_cpp_android_vulkan.sh

      - name: Build llama.cpp CPU and Vulkan backends for arm64-v8a and x86_64
        working-directory: ${{ github.workspace }}/buildsrc
        env:
          LLAMA_CPP_SOURCE_DIR: ${{ runner.temp }}/llama.cpp
          LLAMA_CPP_BUILD_DIR: ${{ runner.temp }}/llama.cpp-build-android
          LLAMA_CPP_INSTALL_DIR: ${{ github.workspace }}/buildsrc/build/llama.cpp-install-android-vulkan
          BUILD_JOBS: '2'
        shell: bash
        run: |
          set -Eeuo pipefail
          export ANDROID_NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          export PATH="$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}/bin:$PATH"
          export ANDROID_ABIS='arm64-v8a x86_64'
          bash tools/build_llama_cpp_android_vulkan.sh 2>&1 | tee build/source-29-validation/native-vulkan-build.log
          for abi in arm64-v8a x86_64; do
            for lib in libllama.so libggml.so libggml-base.so libggml-vulkan.so libggml-cpu.so; do
              test -f "app/src/main/jniLibs/${abi}/${lib}" || { echo "Missing ${abi}/${lib}"; exit 2; }
            done
          done

      - name: Compile APKs and run Android unit tests
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          gradle --no-daemon --project-dir "$GITHUB_WORKSPACE/buildsrc" --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee build/source-29-validation/gradle-build.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          printf 'versionCode=29\nversionName=0.10.7\nabis=arm64-v8a,x86_64\nrunId=%s\ncommit=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > app/build/outputs/apk/build-version-proof.txt

      - name: Upload APKs, per-ABI native libraries and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DongBaKe-source-29-v0.10.7-run-${{ github.run_number }}
          path: |
            buildsrc/app/build/outputs/apk/**
            buildsrc/app/build/reports/**
            buildsrc/app/src/main/jniLibs/**/*.so
            buildsrc/build/llama.cpp-install-android-vulkan/**/*.so
            buildsrc/build/source-29-validation/*.log
            buildsrc/build/source-29-validation/source-29-provenance.txt
            buildsrc/app/build/outputs/logs/**
          if-no-files-found: warn
          retention-days: 14
