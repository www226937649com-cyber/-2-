name: DongBaKe Android build - source-34 performance management

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'DongBaKe-source-33.zip'
      - 'patches/source34.patch.gz.b64'
      - '.github/workflows/build-apk-workflow-source-34.yml'

permissions:
  contents: write

concurrency:
  group: dongbake-source-34-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source-33 base and apply reviewed source-34 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f DongBaKe-source-33.zip
          unzip -t DongBaKe-source-33.zip
          mkdir -p "$GITHUB_WORKSPACE/buildsrc"
          unzip -q DongBaKe-source-33.zip -d "$GITHUB_WORKSPACE/buildsrc"
          test -f buildsrc/settings.gradle.kts
          test -f buildsrc/app/build.gradle.kts
          base64 --decode patches/source34.patch.gz.b64 | gzip --decompress > "$RUNNER_TEMP/source34.patch"
          patch --dry-run --batch --forward -p1 -d "$GITHUB_WORKSPACE/buildsrc" < "$RUNNER_TEMP/source34.patch"
          patch --batch --forward -p1 -d "$GITHUB_WORKSPACE/buildsrc" < "$RUNNER_TEMP/source34.patch"
          grep -q 'applicationId = "com.aiguanjia.app"' buildsrc/app/build.gradle.kts
          grep -q 'versionCode = 34' buildsrc/app/build.gradle.kts
          grep -q 'versionName = "0.12.0-performance-management"' buildsrc/app/build.gradle.kts
          sha256sum DongBaKe-source-33.zip "$RUNNER_TEMP/source34.patch" | tee source-34-input-sha256.txt
          echo 'Verified applicationId=com.aiguanjia.app versionCode=34 versionName=0.12.0-performance-management'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, NDK, CMake, Vulkan dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers libvulkan-dev ninja-build zip
          test -f "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"
          command -v glslc
          command -v ninja

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Package clean source-34 archive
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/buildsrc"
          zip -qr "$GITHUB_WORKSPACE/DongBaKe-source-34.zip" . \
            -x './app/build/*' './app/src/main/jniLibs/*' './build/*' \
               './.gradle/*' './**/__pycache__/*' './**/*.pyc'
          unzip -t "$GITHUB_WORKSPACE/DongBaKe-source-34.zip"
          sha256sum "$GITHUB_WORKSPACE/DongBaKe-source-34.zip" | tee -a "$GITHUB_WORKSPACE/source-34-input-sha256.txt"

      - name: Run source and regression tests
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-34-validation
          python3 -m unittest discover -s tests -v 2>&1 | tee build/source-34-validation/python-tests.log
          bash tools/test_model_profile.sh 2>&1 | tee build/source-34-validation/model-profile-tests.log
          bash tools/test_math_parser.sh 2>&1 | tee build/source-34-validation/math-parser-tests.log
          bash tools/test_source_audit.sh 2>&1 | tee build/source-34-validation/source-audit-tests.log

      - name: Build llama.cpp v0.6.0 for Android CPU + Vulkan
        working-directory: ${{ github.workspace }}/buildsrc
        env:
          LLAMA_CPP_SOURCE_DIR: ${{ runner.temp }}/llama.cpp
          LLAMA_CPP_BUILD_DIR: ${{ runner.temp }}/llama.cpp-build-source34
          LLAMA_CPP_INSTALL_DIR: ${{ github.workspace }}/buildsrc/build/llama.cpp-install-android-vulkan
          BUILD_JOBS: '2'
          BACKEND_PROFILE: vulkan
          ANDROID_ABIS: 'arm64-v8a x86_64'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-34-validation
          export ANDROID_NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          export PATH="$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}/bin:$PATH"
          bash tools/build_llama_cpp_android_vulkan.sh 2>&1 | tee build/source-34-validation/native-vulkan-build.log
          for abi in arm64-v8a x86_64; do
            for lib in libllama.so libggml.so libggml-base.so libggml-cpu.so libggml-vulkan.so; do
              test -f "app/src/main/jniLibs/$abi/$lib" || { echo "Missing $abi/$lib"; exit 4; }
            done
          done
          echo 'Vulkan plugin libraries are present for both ABIs. Device-side execution is not yet proven.'

      - name: Run Android unit tests and assemble APKs
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-34-validation
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee build/source-34-validation/gradle-build.log
          DEBUG_APK="$GITHUB_WORKSPACE/buildsrc/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$DEBUG_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEBUG_APK" | tee build/source-34-validation/apk-badging.txt
          grep -q "package: name='com.aiguanjia.app' versionCode='34' versionName='0.12.0-performance-management'" build/source-34-validation/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$DEBUG_APK" 2>&1 | tee build/source-34-validation/apk-signature-check.txt
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "source_commit=$GITHUB_SHA"
            echo "applicationId=com.aiguanjia.app"
            echo "versionCode=34"
            echo "versionName=0.12.0-performance-management"
            echo "backend_profile=vulkan+cpu"
            echo "device_execution=not_yet_verified"
            sha256sum "$DEBUG_APK"
          } > build/source-34-validation/build-provenance.txt
          find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload APKs, clean source archive, and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DongBaKe-source-34-v0.12.0-run-${{ github.run_number }}
          path: |
            buildsrc/app/build/outputs/apk/**
            buildsrc/app/build/reports/**
            buildsrc/app/build/outputs/logs/**
            buildsrc/app/src/main/jniLibs/arm64-v8a/*.so
            buildsrc/app/src/main/jniLibs/x86_64/*.so
            buildsrc/build/llama.cpp-install-source34/**
            buildsrc/build/source-34-validation/*.log
            buildsrc/build/source-34-validation/*.txt
            DongBaKe-source-34.zip
            source-34-input-sha256.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish source-34 archive to this branch after all checks pass
        if: success() && github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'master')
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DongBaKe-source-34.zip
          if git diff --cached --quiet; then
            echo 'Source archive is already up to date; nothing to commit.'
          else
            git commit -m "Add DongBaKe Android source-34"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
