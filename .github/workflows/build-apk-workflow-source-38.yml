name: DongBaKe Android build - source-38 AI tool dispatch

on:
  workflow_dispatch:
  push:
    branches:
      - work/source-37-context-logging
    paths:
      - 'DongBaKe-source-37.zip'
      - 'patches/source38-bundle-parts/**'
      - 'tools/patch_source38_*.py'
      - '.github/workflows/build-apk-workflow-source-38.yml'

permissions:
  contents: write

concurrency:
  group: dongbake-source-38-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild deterministic source-38 patch bundle and apply to true source input
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f DongBaKe-source-37.zip
          unzip -t DongBaKe-source-37.zip
          mkdir -p "$GITHUB_WORKSPACE/buildsrc" "$RUNNER_TEMP/source38-bundle"
          unzip -q DongBaKe-source-37.zip -d "$GITHUB_WORKSPACE/buildsrc"
          test -f buildsrc/settings.gradle.kts
          test -f buildsrc/app/build.gradle.kts
          cat patches/source38-bundle-parts/part00.txt patches/source38-bundle-parts/part01a.txt patches/source38-bundle-parts/part01b.txt patches/source38-bundle-parts/part02a.txt patches/source38-bundle-parts/part02b.txt patches/source38-bundle-parts/part02c.txt patches/source38-bundle-parts/part02d.txt patches/source38-bundle-parts/part03.txt | tr -d '\r\n' > "$RUNNER_TEMP/source38-bundle.tar.gz.xz.b64"
          test "$(wc -c < "$RUNNER_TEMP/source38-bundle.tar.gz.xz.b64")" -eq 36136
          base64 --decode "$RUNNER_TEMP/source38-bundle.tar.gz.xz.b64" > "$RUNNER_TEMP/source38-bundle.tar.gz.xz"
          echo "e109a5ed216c2b5fa6fe77a2c6c613f85bb5c653e50e97a6c803c2606b771052  $RUNNER_TEMP/source38-bundle.tar.gz.xz" | sha256sum -c -
          xz -t "$RUNNER_TEMP/source38-bundle.tar.gz.xz"
          xz -dc "$RUNNER_TEMP/source38-bundle.tar.gz.xz" | tar -xz -C "$RUNNER_TEMP/source38-bundle"
          python3 "$RUNNER_TEMP/source38-bundle/apply_phase1.py" "$GITHUB_WORKSPACE/buildsrc"
          python3 "$RUNNER_TEMP/source38-bundle/finalize.py" "$GITHUB_WORKSPACE/buildsrc"
          python3 tools/patch_source38_casual_classifier.py "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt"
          cp "$RUNNER_TEMP/source38-bundle/java/AiToolRegistry.kt" buildsrc/app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt
          cp "$RUNNER_TEMP/source38-bundle/java/AiToolRegistryTest.kt" buildsrc/app/src/test/java/com/aiguanjia/app/AiToolRegistryTest.kt
          cp "$RUNNER_TEMP/source38-bundle"/tests/*.py buildsrc/tests/
          python3 tools/patch_source38_strict_tool_protocol.py "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt" "$GITHUB_WORKSPACE/buildsrc/app/src/test/java/com/aiguanjia/app/AiToolRegistryTest.kt" "$GITHUB_WORKSPACE/buildsrc/tests/test_progress_audit.py" "$GITHUB_WORKSPACE/buildsrc/tests/test_runtime_observability.py"
          grep -q 'applicationId = "com.aiguanjia.app"' buildsrc/app/build.gradle.kts
          grep -q 'versionCode = 38' buildsrc/app/build.gradle.kts
          grep -q 'versionName = "0.12.4-ai-tool-dispatch"' buildsrc/app/build.gradle.kts
          grep -q 'MAX_TOOL_CALLS_PER_TURN = 3' buildsrc/app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt
          grep -q 'runModelWithTools' buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt
          if grep -Eq 'routeForQuestion\(|ToolDecisionEngine|runSearchAndAnswer\(|runCalculatorAnswer\(|evaluateSimpleArithmetic\(' buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt; then
            echo 'Legacy pre-model tool route remains in MainActivity.kt' >&2
            exit 5
          fi
          sha256sum DongBaKe-source-37.zip "$RUNNER_TEMP/source38-bundle.tar.gz.xz" | tee source-38-input-sha256.txt
          echo 'Verified applicationId=com.aiguanjia.app versionCode=38 versionName=0.12.4-ai-tool-dispatch'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, NDK, CMake and native build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers libvulkan-dev ninja-build zip unzip
          test -f "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"
          command -v glslc
          command -v ninja

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run existing and new source tests
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-38-validation
          python3 -m unittest discover -s tests -v 2>&1 | tee build/source-38-validation/python-tests.log
          bash tools/test_model_profile.sh 2>&1 | tee build/source-38-validation/model-profile-tests.log
          bash tools/test_math_parser.sh 2>&1 | tee build/source-38-validation/math-parser-tests.log
          bash tools/test_source_audit.sh 2>&1 | tee build/source-38-validation/source-audit-tests.log
          {
            echo '# source-38 validation log generated during this CI run'
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo
            cat build/source-38-validation/python-tests.log
            cat build/source-38-validation/model-profile-tests.log
            cat build/source-38-validation/math-parser-tests.log
            cat build/source-38-validation/source-audit-tests.log
          } > tests.log

      - name: Build existing llama.cpp CPU and Vulkan libraries
        working-directory: ${{ github.workspace }}/buildsrc
        env:
          LLAMA_CPP_SOURCE_DIR: ${{ runner.temp }}/llama.cpp
          LLAMA_CPP_BUILD_DIR: ${{ runner.temp }}/llama.cpp-build-source38
          LLAMA_CPP_INSTALL_DIR: ${{ github.workspace }}/buildsrc/build/llama.cpp-install-android-vulkan
          BUILD_JOBS: '2'
          BACKEND_PROFILE: vulkan
          ANDROID_ABIS: 'arm64-v8a x86_64'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-38-validation
          export ANDROID_NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          export PATH="$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}/bin:$PATH"
          bash tools/build_llama_cpp_android_vulkan.sh 2>&1 | tee build/source-38-validation/native-vulkan-build.log
          for abi in arm64-v8a x86_64; do
            for lib in libllama.so libggml.so libggml-base.so libggml-cpu.so libggml-vulkan.so; do
              test -f "app/src/main/jniLibs/$abi/$lib" || { echo "Missing $abi/$lib" >&2; exit 4; }
            done
          done
          echo 'Native build completed; actual target-device execution remains unverified.'

      - name: Run Android tests and assemble APKs
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-38-validation
          gradle --no-daemon --stacktrace -PdongbakeNativeBackend=vulkan :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee build/source-38-validation/gradle-build.log
          DEBUG_APK="$GITHUB_WORKSPACE/buildsrc/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$GITHUB_WORKSPACE/buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEBUG_APK" | tee build/source-38-validation/debug-apk-badging.txt
          grep -q "package: name='com.aiguanjia.app' versionCode='38' versionName='0.12.4-ai-tool-dispatch'" build/source-38-validation/debug-apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$DEBUG_APK" 2>&1 | tee build/source-38-validation/debug-apk-signature-check.txt
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "source_commit=$GITHUB_SHA"
            echo "applicationId=com.aiguanjia.app"
            echo "versionCode=38"
            echo "versionName=0.12.4-ai-tool-dispatch"
            echo "device_execution=not_yet_verified"
            sha256sum "$DEBUG_APK" "$RELEASE_APK"
          } > build/source-38-validation/build-provenance.txt

      - name: Build safe side-by-side APK without replacing the existing app
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p app/build/outputs/apk/primary app/build/outputs/apk/side-by-side
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/primary/DongBaKe-v0.12.4-ai-tool-dispatch-debug.apk
          cp app/build.gradle.kts "$RUNNER_TEMP/source38-app-build.gradle.kts"
          cp app/src/main/AndroidManifest.xml "$RUNNER_TEMP/source38-AndroidManifest.xml"
          restore_build_files() {
            cp "$RUNNER_TEMP/source38-app-build.gradle.kts" app/build.gradle.kts
            cp "$RUNNER_TEMP/source38-AndroidManifest.xml" app/src/main/AndroidManifest.xml
          }
          trap restore_build_files EXIT
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle.kts")
          manifest = Path("app/src/main/AndroidManifest.xml")
          g = gradle.read_text()
          m = manifest.read_text()
          old_id = 'applicationId = "com.aiguanjia.app"'
          new_id = 'applicationId = "com.aiguanjia.app.tooltest38"'
          old_label = 'android:label="东巴壳"'
          new_label = 'android:label="东巴壳（AI工具调度测试）"'
          if g.count(old_id) != 1:
              raise SystemExit("Expected exactly one primary applicationId before side-by-side build")
          if m.count(old_label) != 1:
              raise SystemExit("Expected exactly one main app label before side-by-side build")
          gradle.write_text(g.replace(old_id, new_id, 1))
          manifest.write_text(m.replace(old_label, new_label, 1))
          PY
          gradle --no-daemon --stacktrace -PdongbakeNativeBackend=vulkan :app:assembleDebug 2>&1 | tee build/source-38-validation/gradle-side-by-side-build.log
          SIDE_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SIDE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SIDE_APK" | tee build/source-38-validation/side-by-side-apk-badging.txt
          grep -q "package: name='com.aiguanjia.app.tooltest38' versionCode='38' versionName='0.12.4-ai-tool-dispatch'" build/source-38-validation/side-by-side-apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIDE_APK" 2>&1 | tee build/source-38-validation/side-by-side-apk-signature-check.txt
          cp "$SIDE_APK" app/build/outputs/apk/side-by-side/DongBaKe-v0.12.4-ai-tool-dispatch-side-by-side.apk
          {
            echo "applicationId=com.aiguanjia.app.tooltest38"
            echo "versionCode=38"
            echo "versionName=0.12.4-ai-tool-dispatch"
            echo "label=东巴壳（AI工具调度测试）"
            echo "installMode=side-by-side; does not replace com.aiguanjia.app"
            echo "dataIsolation=separate app data; existing chat history is not copied"
            sha256sum app/build/outputs/apk/side-by-side/DongBaKe-v0.12.4-ai-tool-dispatch-side-by-side.apk
          } > build/source-38-validation/side-by-side-proof.txt
          restore_build_files
          trap - EXIT

      - name: Package and verify reproducible source-38 archive
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test -d "$GITHUB_WORKSPACE/buildsrc"
          cd "$GITHUB_WORKSPACE/buildsrc"
          test -z "$(find . -type f \( -name '*.orig' -o -name '*.rej' -o -name '*.bak' \) -print -quit)"
          zip -qr "$GITHUB_WORKSPACE/DongBaKe-source-38.zip" . \
            -x './app/build/*' './app/.cxx/*' './app/src/main/jniLibs/*' './build/*' \
               './.gradle/*' './.kotlin/*' './**/__pycache__/*' './**/*.pyc'
          unzip -t "$GITHUB_WORKSPACE/DongBaKe-source-38.zip"
          unzip -p "$GITHUB_WORKSPACE/DongBaKe-source-38.zip" app/build.gradle.kts | grep -q 'versionCode = 38'
          unzip -p "$GITHUB_WORKSPACE/DongBaKe-source-38.zip" app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt | grep -q 'MAX_TOOL_CALLS_PER_TURN = 3'
          sha256sum "$GITHUB_WORKSPACE/DongBaKe-source-38.zip" | tee -a "$GITHUB_WORKSPACE/source-38-input-sha256.txt"

      - name: Upload APKs, source archive and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DongBaKe-source-38-v0.12.4-ai-tool-dispatch-run-${{ github.run_number }}
          path: |
            buildsrc/app/build/outputs/apk/**
            buildsrc/app/build/reports/**
            buildsrc/app/build/outputs/logs/**
            buildsrc/app/src/main/jniLibs/arm64-v8a/*.so
            buildsrc/app/src/main/jniLibs/x86_64/*.so
            buildsrc/build/source-38-validation/**
            DongBaKe-source-38.zip
            source-38-input-sha256.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Publish source-38 archive to this work branch after all checks pass
        if: success() && github.event_name == 'push' && github.ref_name == 'work/source-37-context-logging'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DongBaKe-source-38.zip
          if git diff --cached --quiet; then
            echo 'Source archive is already up to date; nothing to commit.'
          else
            git commit -m "Add DongBaKe source-38 AI tool dispatch source archive"
            # The branch may advance while a long native build is running.
            # Rebase this archive-only commit on the latest remote branch to avoid
            # rejecting the build just because a concurrent commit landed.
            git fetch --no-tags origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi
