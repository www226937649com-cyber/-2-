name: DongBaKe Android build - source-40 performance routing

on:
  workflow_dispatch:
  push:
    branches:
      - work/source-37-context-logging
    paths:
      - 'patches/source40-bundle/**'
      - '.github/workflows/build-apk-workflow-source-40.yml'

permissions:
  contents: write

concurrency:
  group: dongbake-source-40-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: '27.2.12479018'
  ANDROID_CMAKE_VERSION: '3.22.1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Source39 deterministically and apply Source40 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f DongBaKe-source-37.zip
          unzip -t DongBaKe-source-37.zip
          mkdir -p "$GITHUB_WORKSPACE/buildsrc" "$RUNNER_TEMP/source38-bundle"
          unzip -q DongBaKe-source-37.zip -d "$GITHUB_WORKSPACE/buildsrc"
          test -f buildsrc/settings.gradle.kts
          test -f buildsrc/app/build.gradle.kts
          cat patches/source38-bundle-parts/part00.txt patches/source38-bundle-parts/part01a.txt patches/source38-bundle-parts/part01b.txt patches/source38-bundle-parts/part02a.txt patches/source38-bundle-parts/part02b.txt patches/source38-bundle-parts/part02c.txt patches/source38-bundle-parts/part02d.txt patches/source38-bundle-parts/part03.txt | tr -d '\r\n' > "$RUNNER_TEMP/source38-bundle.tar.gz.xz.b64"
          test "$(wc -c < "$RUNNER_TEMP/source38-bundle.tar.gz.xz.b64")" -eq 36136
          base64 --decode "$RUNNER_TEMP/source38-bundle.tar.gz.xz.b64" > "$RUNNER_TEMP/source38-bundle.tar.gz.xz"
          echo "e109a5ed216c2b5fa6fe77a2c6c613f85bb5c653e50e97a6c803c2606b771052  $RUNNER_TEMP/source38-bundle.tar.gz.xz" | sha256sum -c -
          xz -t "$RUNNER_TEMP/source38-bundle.tar.gz.xz"
          xz -dc "$RUNNER_TEMP/source38-bundle.tar.gz.xz" | tar -xz -C "$RUNNER_TEMP/source38-bundle"
          python3 "$RUNNER_TEMP/source38-bundle/apply_phase1.py" "$GITHUB_WORKSPACE/buildsrc"
          python3 "$RUNNER_TEMP/source38-bundle/finalize.py" "$GITHUB_WORKSPACE/buildsrc"
          python3 tools/patch_source38_casual_classifier.py "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt"
          cp "$RUNNER_TEMP/source38-bundle/java/AiToolRegistry.kt" buildsrc/app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt
          cp "$RUNNER_TEMP/source38-bundle/java/AiToolRegistryTest.kt" buildsrc/app/src/test/java/com/aiguanjia/app/AiToolRegistryTest.kt
          cp "$RUNNER_TEMP/source38-bundle"/tests/*.py buildsrc/tests/
          python3 tools/patch_source38_strict_tool_protocol.py "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt" "$GITHUB_WORKSPACE/buildsrc/app/src/test/java/com/aiguanjia/app/AiToolRegistryTest.kt" "$GITHUB_WORKSPACE/buildsrc/tests/test_progress_audit.py" "$GITHUB_WORKSPACE/buildsrc/tests/test_runtime_observability.py" "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt"
          python3 tools/fix_first_token_regression.py "$GITHUB_WORKSPACE/buildsrc/app/build.gradle.kts" "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt" "$GITHUB_WORKSPACE/buildsrc/app/src/test/java/com/aiguanjia/app/AiToolRegistryTest.kt" "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt" "$GITHUB_WORKSPACE/buildsrc/tests" "$GITHUB_WORKSPACE/buildsrc/README.md"
          grep -q 'applicationId = "com.aiguanjia.app"' buildsrc/app/build.gradle.kts
          grep -q 'versionCode = 39' buildsrc/app/build.gradle.kts
          grep -q 'versionName = "0.12.5-ai-tool-dispatch"' buildsrc/app/build.gradle.kts
          test -d patches/source40-bundle
          test "$(find patches/source40-bundle -maxdepth 1 -type f -name 'part*.txt' | wc -l)" -ge 2
          mkdir -p "$RUNNER_TEMP/source40"
          cat patches/source40-bundle/part*.txt | base64 --decode | gzip -dc > "$RUNNER_TEMP/source40/source40.patch"
          echo "231b29660383316017dea9c6dfd4d7315b75792926e4c9117d9bc65d157c73e2  $RUNNER_TEMP/source40/source40.patch" | sha256sum -c -
          cd "$GITHUB_WORKSPACE/buildsrc"
          patch -p1 --batch --fuzz=0 < "$RUNNER_TEMP/source40/source40.patch"
          echo "741108a9fe9f7d3337ccd5331a023d61608e40fd69becaf2d83e93bff8feaf0f  $RUNNER_TEMP/source40/source40-hotfix.patch.gz" > "$RUNNER_TEMP/source40-hotfix-gzip.sha256"
          cat "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part00.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part01.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part02.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part03.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part04.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part05.txt" > "$RUNNER_TEMP/source40/source40-hotfix.patch.gz.b64"
          echo "f5ea27036f2c6abb0092b08a0f8e1c8b8f54ac8a2416832ef991092cfbc46f8f  $RUNNER_TEMP/source40/source40-hotfix.patch.gz.b64" > "$RUNNER_TEMP/source40-hotfix-b64.sha256"
          sha256sum -c "$RUNNER_TEMP/source40-hotfix-b64.sha256"
          base64 --decode "$RUNNER_TEMP/source40/source40-hotfix.patch.gz.b64" > "$RUNNER_TEMP/source40/source40-hotfix.patch.gz"
          sha256sum -c "$RUNNER_TEMP/source40-hotfix-gzip.sha256"
          gzip -dc "$RUNNER_TEMP/source40/source40-hotfix.patch.gz" > "$RUNNER_TEMP/source40/source40-hotfix.patch"
          echo "92d1b6f2858184eece11e1a7a6546c8ba66c3b14cff3e9d7126294e8eb30b321  $RUNNER_TEMP/source40/source40-hotfix.patch" | sha256sum -c -
          patch -p1 --batch --fuzz=0 < "$RUNNER_TEMP/source40/source40-hotfix.patch"
          sha256sum "$GITHUB_WORKSPACE/patches/source40-bundle/source40-model-autoload.patch" | tee -a "$GITHUB_WORKSPACE/source-40-input-sha256.txt"
          patch -p1 --batch --fuzz=0 < "$GITHUB_WORKSPACE/patches/source40-bundle/source40-model-autoload.patch"
          grep -q 'model_restore_auto_begin' app/src/main/java/com/aiguanjia/app/MainActivity.kt
          grep -q 'prefix_cache_reused_tokens' app/src/main/cpp/dongbake_llama_jni.cpp
          grep -q 'applicationId = "com.aiguanjia.app"' app/build.gradle.kts
          grep -q 'versionCode = 40' app/build.gradle.kts
          grep -q 'versionName = "0.12.6-ai-performance-routing"' app/build.gradle.kts
          grep -q 'implementation("com.microsoft.onnxruntime:onnxruntime-android:1.31.0")' app/build.gradle.kts
          grep -q 'nativeSetVerboseLogging' app/src/main/java/com/aiguanjia/app/NativeLlamaEngine.kt
          grep -q 'LocalEmbeddingRouter.route' app/src/main/java/com/aiguanjia/app/MainActivity.kt
          grep -q 'nativeReleaseInferenceContext' app/src/main/java/com/aiguanjia/app/NativeLlamaEngine.kt
          if grep -Eq 'routeForQuestion\(|ToolDecisionEngine|runSearchAndAnswer\(|runCalculatorAnswer\(|evaluateSimpleArithmetic\(' app/src/main/java/com/aiguanjia/app/MainActivity.kt; then
            echo 'Legacy pre-model tool route unexpectedly reappeared' >&2
            exit 5
          fi
          cd "$GITHUB_WORKSPACE"
          sha256sum DongBaKe-source-37.zip "$RUNNER_TEMP/source38-bundle.tar.gz.xz" "$RUNNER_TEMP/source40/source40.patch" | tee source-40-input-sha256.txt
          echo 'Verified Source40 applicationId=com.aiguanjia.app versionCode=40 versionName=0.12.6-ai-performance-routing'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform, NDK, CMake and native build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}" "cmake;${ANDROID_CMAKE_VERSION}"
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers libvulkan-dev ninja-build zip unzip patch
          test -f "$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}/build/cmake/android.toolchain.cmake"
          command -v glslc
          command -v ninja

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run existing and Source40 regression tests
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-40-validation
          python3 -m unittest discover -s tests -v 2>&1 | tee build/source-40-validation/python-tests.log
          bash tools/test_model_profile.sh 2>&1 | tee build/source-40-validation/model-profile-tests.log
          bash tools/test_math_parser.sh 2>&1 | tee build/source-40-validation/math-parser-tests.log
          bash tools/test_source_audit.sh 2>&1 | tee build/source-40-validation/source-audit-tests.log
          {
            echo '# Source40 validation log generated by this workflow run'
            echo "commit=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            cat build/source-40-validation/python-tests.log
            cat build/source-40-validation/model-profile-tests.log
            cat build/source-40-validation/math-parser-tests.log
            cat build/source-40-validation/source-audit-tests.log
          } > tests.log

      - name: Build existing llama.cpp CPU and Vulkan libraries
        working-directory: ${{ github.workspace }}/buildsrc
        env:
          LLAMA_CPP_SOURCE_DIR: ${{ runner.temp }}/llama.cpp
          LLAMA_CPP_BUILD_DIR: ${{ runner.temp }}/llama.cpp-build-source40
          LLAMA_CPP_INSTALL_DIR: ${{ github.workspace }}/buildsrc/build/llama.cpp-install-android-vulkan
          BUILD_JOBS: '2'
          BACKEND_PROFILE: vulkan
          ANDROID_ABIS: 'arm64-v8a x86_64'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-40-validation
          export ANDROID_NDK="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          export PATH="$ANDROID_HOME/cmake/${ANDROID_CMAKE_VERSION}/bin:$PATH"
          bash tools/build_llama_cpp_android_vulkan.sh 2>&1 | tee build/source-40-validation/native-vulkan-build.log
          for abi in arm64-v8a x86_64; do
            for lib in libllama.so libggml.so libggml-base.so libggml-cpu.so libggml-vulkan.so; do
              test -f "app/src/main/jniLibs/$abi/$lib" || { echo "Missing $abi/$lib" >&2; exit 4; }
            done
          done
          echo 'Native libraries built; target-device execution is not verified by CI.'

      - name: Run Android tests and assemble APKs
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build/source-40-validation app/build/outputs/apk/primary
          gradle --no-daemon --stacktrace -PdongbakeNativeBackend=vulkan :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease 2>&1 | tee build/source-40-validation/gradle-build.log
          DEBUG_APK="$GITHUB_WORKSPACE/buildsrc/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="$GITHUB_WORKSPACE/buildsrc/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$DEBUG_APK"
          test -f "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$DEBUG_APK" | tee build/source-40-validation/debug-apk-badging.txt
          grep -q "package: name='com.aiguanjia.app' versionCode='40' versionName='0.12.6-ai-performance-routing'" build/source-40-validation/debug-apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$DEBUG_APK" 2>&1 | tee build/source-40-validation/debug-apk-signature-check.txt
          cp "$DEBUG_APK" app/build/outputs/apk/primary/DongBaKe-v0.12.6-ai-performance-routing-debug.apk
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_number=$GITHUB_RUN_NUMBER"
            echo "source_commit=$GITHUB_SHA"
            echo "applicationId=com.aiguanjia.app"
            echo "versionCode=40"
            echo "versionName=0.12.6-ai-performance-routing"
            echo "device_execution=not_verified"
            sha256sum "$DEBUG_APK" "$RELEASE_APK"
          } > build/source-40-validation/build-provenance.txt

      - name: Build isolated side-by-side testing APK
        working-directory: ${{ github.workspace }}/buildsrc
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p app/build/outputs/apk/side-by-side
          cp app/build.gradle.kts "$RUNNER_TEMP/source40-app-build.gradle.kts"
          cp app/src/main/AndroidManifest.xml "$RUNNER_TEMP/source40-AndroidManifest.xml"
          restore_build_files() {
            cp "$RUNNER_TEMP/source40-app-build.gradle.kts" app/build.gradle.kts
            cp "$RUNNER_TEMP/source40-AndroidManifest.xml" app/src/main/AndroidManifest.xml
          }
          trap restore_build_files EXIT
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path("app/build.gradle.kts")
          manifest = Path("app/src/main/AndroidManifest.xml")
          g = gradle.read_text()
          m = manifest.read_text()
          old_id = 'applicationId = "com.aiguanjia.app"'
          new_id = 'applicationId = "com.aiguanjia.app.tooltest40"'
          old_label = 'android:label="东巴壳"'
          new_label = 'android:label="东巴壳（Source40隔离测试）"'
          if g.count(old_id) != 1 or m.count(old_label) != 1:
              raise SystemExit("Expected exactly one primary package id and app label before side-by-side build")
          gradle.write_text(g.replace(old_id, new_id, 1))
          manifest.write_text(m.replace(old_label, new_label, 1))
          PY
          gradle --no-daemon --stacktrace -PdongbakeNativeBackend=vulkan :app:assembleDebug 2>&1 | tee build/source-40-validation/gradle-side-by-side-build.log
          SIDE_APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$SIDE_APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SIDE_APK" | tee build/source-40-validation/side-by-side-apk-badging.txt
          grep -q "package: name='com.aiguanjia.app.tooltest40' versionCode='40' versionName='0.12.6-ai-performance-routing'" build/source-40-validation/side-by-side-apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIDE_APK" 2>&1 | tee build/source-40-validation/side-by-side-apk-signature-check.txt
          cp "$SIDE_APK" app/build/outputs/apk/side-by-side/DongBaKe-v0.12.6-ai-performance-routing-side-by-side.apk
          {
            echo "applicationId=com.aiguanjia.app.tooltest40"
            echo "versionCode=40"
            echo "versionName=0.12.6-ai-performance-routing"
            echo "installMode=side-by-side; does not replace com.aiguanjia.app or touch its user data"
            echo "signature=GitHub Actions debug signing; not proven update-compatible with an installed production APK"
            sha256sum app/build/outputs/apk/side-by-side/DongBaKe-v0.12.6-ai-performance-routing-side-by-side.apk
          } > build/source-40-validation/side-by-side-proof.txt
          restore_build_files
          trap - EXIT

      - name: Package and verify Source40 source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/buildsrc"
          test -z "$(find . -type f \( -name '*.orig' -o -name '*.rej' -o -name '*.bak' \) -print -quit)"
          cd "$GITHUB_WORKSPACE"
          rm -f DongBaKe-source-40.zip
          cd "$GITHUB_WORKSPACE/buildsrc"
          zip -qr "$GITHUB_WORKSPACE/DongBaKe-source-40.zip" . \
            -x './app/build/*' './app/.cxx/*' './app/src/main/jniLibs/*' './build/*' \
               './.gradle/*' './.kotlin/*' './**/__pycache__/*' './**/*.pyc'
          unzip -t "$GITHUB_WORKSPACE/DongBaKe-source-40.zip"
          unzip -p "$GITHUB_WORKSPACE/DongBaKe-source-40.zip" app/build.gradle.kts | grep -q 'versionCode = 40'
          unzip -p "$GITHUB_WORKSPACE/DongBaKe-source-40.zip" app/build.gradle.kts | grep -q 'versionName = "0.12.6-ai-performance-routing"'
          unzip -p "$GITHUB_WORKSPACE/DongBaKe-source-40.zip" app/build.gradle.kts | grep -q 'applicationId = "com.aiguanjia.app"'
          unzip -Z1 "$GITHUB_WORKSPACE/DongBaKe-source-40.zip" | grep -q 'app/src/main/java/com/aiguanjia/app/LocalEmbeddingRouter.kt'
          unzip -Z1 "$GITHUB_WORKSPACE/DongBaKe-source-40.zip" | grep -q 'app/src/main/python/code_sandbox.py'
          sha256sum "$GITHUB_WORKSPACE/DongBaKe-source-40.zip" | tee -a "$GITHUB_WORKSPACE/source-40-input-sha256.txt"

      - name: Upload APKs, source archive and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DongBaKe-source-40-v0.12.6-ai-performance-routing-run-${{ github.run_number }}
          path: |
            buildsrc/app/build/outputs/apk/**
            buildsrc/app/build/reports/**
            buildsrc/app/build/outputs/logs/**
            buildsrc/app/src/main/jniLibs/arm64-v8a/*.so
            buildsrc/app/src/main/jniLibs/x86_64/*.so
            buildsrc/build/source-40-validation/**
            DongBaKe-source-40.zip
            source-40-input-sha256.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload compact install package (APKs and source archive only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DongBaKe-source-40-installers-v0.12.6-run-${{ github.run_number }}
          path: |
            buildsrc/app/build/outputs/apk/primary/DongBaKe-v0.12.6-ai-performance-routing-debug.apk
            buildsrc/app/build/outputs/apk/side-by-side/DongBaKe-v0.12.6-ai-performance-routing-side-by-side.apk
            DongBaKe-source-40.zip
            source-40-input-sha256.txt
            buildsrc/build/source-40-validation/build-provenance.txt
            buildsrc/build/source-40-validation/side-by-side-proof.txt
            buildsrc/build/source-40-validation/debug-apk-badging.txt
            buildsrc/build/source-40-validation/side-by-side-apk-badging.txt
            buildsrc/build/source-40-validation/python-tests.log
            buildsrc/build/source-40-validation/model-profile-tests.log
            buildsrc/build/source-40-validation/math-parser-tests.log
            buildsrc/build/source-40-validation/source-audit-tests.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish Source40 archive to this work branch after all checks pass
        if: success() && github.event_name == 'push' && github.ref_name == 'work/source-37-context-logging'
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ARCHIVE_COPY="$RUNNER_TEMP/DongBaKe-source-40-to-publish.zip"
          cp "$GITHUB_WORKSPACE/DongBaKe-source-40.zip" "$ARCHIVE_COPY"
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin "${GITHUB_REF_NAME}"
            git checkout --detach "origin/${GITHUB_REF_NAME}"
            cp "$ARCHIVE_COPY" "$GITHUB_WORKSPACE/DongBaKe-source-40.zip"
            git add DongBaKe-source-40.zip
            if git diff --cached --quiet; then
              echo 'This exact Source40 archive is already present on the work branch.'
              exit 0
            fi
            git commit -m "Add DongBaKe Source40 v0.12.6 performance routing source archive (run ${GITHUB_RUN_NUMBER}, attempt $attempt)"
            if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
              echo 'Verified Source40 archive published to the work branch.'
              exit 0
            fi
            echo "Publication raced with another work-branch commit (attempt $attempt/5); fetching fresh HEAD and retrying."
          done
          echo 'Source40 archive publication failed after five non-destructive retries.' >&2
          exit 1
