name: Diagnose DongBaKe model-load crash

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-model-load-crash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Find GPU and memory defaults
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/dbk-src
          unzip -q DongBaKe-source-24.zip -d /tmp/dbk-src
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("/tmp/dbk-src")
          pats = re.compile(r"inference_gpu_layers|configuredContextSize|configuredCpuThreads|gpuLayers|availableMemory|MemoryInfo|large.*model|modelBytes|loadModel\(", re.I)
          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix not in {".kt", ".java", ".cpp", ".h", ".kts", ".xml"}:
                  continue
              rel = p.relative_to(root).as_posix()
              if not rel.startswith(("app/src/main/", "app/build.gradle")):
                  continue
              lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
              hits = [i for i,x in enumerate(lines) if pats.search(x)]
              if not hits: continue
              print(f"\n=== {rel} ===")
              done = set()
              for i in hits:
                  a,b=max(0,i-3),min(len(lines),i+4)
                  for n in range(a,b):
                      if n not in done:
                          print(f"{n+1}: {lines[n]}")
                          done.add(n)
          PY
