name: Diagnose DongBaKe model-load crash

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-model-load-crash.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source archive
        uses: actions/checkout@v4
      - name: Inspect exact model-load path
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/dbk-src
          unzip -q DongBaKe-source-24.zip -d /tmp/dbk-src
          python3 - <<'PY'
          from pathlib import Path

          root = Path("/tmp/dbk-src")
          targets = {
              "app/src/main/java/com/aiguanjia/app/NativeLlamaEngine.kt": [(1, 240)],
              "app/src/main/cpp/dongbake_llama_jni.cpp": [(1, 115), (285, 355)],
              "app/src/main/AndroidManifest.xml": [(1, 180)],
              "app/build.gradle.kts": [(1, 150)],
          }
          main = root / "app/src/main/java/com/aiguanjia/app/MainActivity.kt"
          if main.exists():
              lines = main.read_text(encoding="utf-8", errors="replace").splitlines()
              keys = ("private fun importModel", "private fun loadLocalModel", "private fun unloadLocalModel")
              for key in keys:
                  hits = [i for i, line in enumerate(lines) if key in line]
                  for i in hits:
                      targets.setdefault("app/src/main/java/com/aiguanjia/app/MainActivity.kt", []).append((max(1, i+1-12), min(len(lines), i+1+110)))
          for rel, ranges in targets.items():
              p = root / rel
              if not p.exists():
                  print(f"\n=== MISSING {rel} ===")
                  continue
              lines = p.read_text(encoding="utf-8", errors="replace").splitlines()
              print(f"\n========== {rel} ({len(lines)} lines) ==========")
              for start, end in ranges:
                  print(f"\n--- lines {start}-{min(end, len(lines))} ---")
                  for i in range(start-1, min(end, len(lines))):
                      print(f"{i+1}: {lines[i]}")
          PY
