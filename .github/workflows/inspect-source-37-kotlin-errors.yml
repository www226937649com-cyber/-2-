name: Inspect source-37 Kotlin compile errors

on:
  workflow_dispatch:
  push:
    branches:
      - work/source-37-context-logging
    paths:
      - '.github/workflows/inspect-source-37-kotlin-errors.yml'
      - 'DongBaKe-source-36.zip'
      - 'patches/source37-parts/**'

permissions:
  contents: read

concurrency:
  group: dongbake-source-37-inspect
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify source patch
        shell: bash
        run: |
          set -Eeuo pipefail
          unzip -t DongBaKe-source-36.zip >/dev/null
          mkdir -p "$RUNNER_TEMP/buildsrc"
          unzip -q DongBaKe-source-36.zip -d "$RUNNER_TEMP/buildsrc"
          cat patches/source37-parts/part00.txt patches/source37-parts/part01.txt patches/source37-parts/part02.txt patches/source37-parts/part03.txt patches/source37-parts/part04.txt patches/source37-parts/part05.txt patches/source37-parts/part06.txt > "$RUNNER_TEMP/source37.patch.b64"
          test "$(wc -c < "$RUNNER_TEMP/source37.patch.b64")" -eq 25688
          base64 --decode "$RUNNER_TEMP/source37.patch.b64" > "$RUNNER_TEMP/source37.patch.gz"
          gzip -t "$RUNNER_TEMP/source37.patch.gz"
          gzip -dc "$RUNNER_TEMP/source37.patch.gz" > "$RUNNER_TEMP/source37.patch"
          patch --dry-run --batch --forward -p1 -d "$RUNNER_TEMP/buildsrc" < "$RUNNER_TEMP/source37.patch"
          patch --batch --forward -p1 -d "$RUNNER_TEMP/buildsrc" < "$RUNNER_TEMP/source37.patch"
          echo "===== MainActivity.kt lines 1768-1860 ====="
          nl -ba "$RUNNER_TEMP/buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt" | sed -n '1768,1860p'
          echo "===== Patch references ====="
          grep -nE '^(---|\+\+\+|@@)' "$RUNNER_TEMP/source37.patch" | head -100
