name: Inspect DongBaKe safe patch points

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-ui-hooks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print source chunks
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/dbk-src
          unzip -q DongBaKe-source-24.zip -d /tmp/dbk-src
          python3 - <<'PY'
          from pathlib import Path
          root = Path("/tmp/dbk-src")
          chunks = {
            "app/src/main/java/com/aiguanjia/app/MainActivity.kt": [(1,120),(260,430),(880,980),(1230,1330),(2830,3040)],
            "app/src/main/java/com/aiguanjia/app/NativeLlamaEngine.kt": [(1,100)],
            "app/src/main/AndroidManifest.xml": [(1,120)],
            "app/build.gradle.kts": [(1,80)],
          }
          for rel, ranges in chunks.items():
            p=root/rel
            print(f"\n========== {rel} ==========")
            if not p.exists():
              print("MISSING")
              continue
            lines=p.read_text(encoding="utf-8",errors="replace").splitlines()
            for a,b in ranges:
              print(f"\n--- {a}-{min(b,len(lines))} ---")
              for i in range(a-1,min(b,len(lines))):
                print(f"{i+1}: {lines[i]}")
          PY
