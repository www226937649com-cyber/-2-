name: Publish DongBaKe source-26 APK to GitHub Releases

on:
  workflow_run:
    workflows: ["DongBaKe Android build - source-26 native stability"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: v0.10.4-source-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download APKs from the successful source-26 build
        uses: actions/download-artifact@v4
        with:
          name: DongBaKe-source-26-v0.10.4-run-${{ github.event.workflow_run.run_number }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloaded-build

      - name: Prepare release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p release-assets
          DEBUG_APK="$(find downloaded-build -type f -path '*/debug/app-debug.apk' -print -quit)"
          RELEASE_APK="$(find downloaded-build -type f -name 'app-release-unsigned.apk' -print -quit)"
          test -n "$DEBUG_APK" || { echo "ERROR: app-debug.apk not found"; find downloaded-build -maxdepth 8 -type f | head -100; exit 2; }
          cp "$DEBUG_APK" release-assets/DongBaKe-v0.10.4-debug.apk
          if [[ -n "$RELEASE_APK" ]]; then
            cp "$RELEASE_APK" release-assets/DongBaKe-v0.10.4-release-unsigned.apk
          fi
          ls -lh release-assets/*.apk
          file release-assets/*.apk

      - name: Publish APK files to GitHub Releases
        shell: bash
        run: |
          set -Eeuo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<'EOF'
          DongBaKe Android v0.10.4 (source revision 26).

          - DongBaKe-v0.10.4-debug.apk: signed debug build for installation and testing.
          - DongBaKe-v0.10.4-release-unsigned.apk: unsigned release build, not directly installable until signed.

          Source revision 26 removes the incorrect file-size-versus-free-RAM admission gate: the app records memory data for diagnostics but does not reject a GGUF model based on its file length. The native CPU backend loader is initialized correctly even with GPU offload disabled; Vulkan device enumeration remains conditional on a nonzero GPU-layer request.

          Prompt prefill now uses batches capped at 512 tokens while preserving the configured context size. The native llama.cpp log tail is exposed to the local diagnostic log; sampler allocation checks, native error records, and inference crash breadcrumbs were added. Existing app features and the app-version/system-version pages remain in place.

          Minimum Android version: Android 10 (API 29). Please test on a real device: CI compilation and unit tests cannot guarantee stability for every model, memory configuration, or device driver.

          Minimum Android version: Android 10 (API 29). GPU/Vulkan loading is not enabled by default in this stability build and still requires device-specific validation.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.apk \
              --title "DongBaKe v0.10.4 (source-26 stability)" \
              --notes-file "$NOTES" \
              --target "$SOURCE_SHA"
          fi
          gh release view "$RELEASE_TAG" --json name,tagName,url,assets
