name: Inspect source-37 patch without native build

on:
  push:
    branches:
      - work/source-37-context-logging
    paths:
      - '.github/workflows/source37-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct and apply source-37 patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat patches/source37-parts/part00.txt patches/source37-parts/part01.txt patches/source37-parts/part02.txt patches/source37-parts/part03.txt patches/source37-parts/part04.txt patches/source37-parts/part05.txt patches/source37-parts/part06.txt > /tmp/source37.patch.b64
          test "$(wc -c < /tmp/source37.patch.b64)" -eq 25688
          base64 --decode /tmp/source37.patch.b64 > /tmp/source37.patch.gz
          gzip -t /tmp/source37.patch.gz
          echo "a4af3291439a2044c4a13442785f88ee0a2cb50ac22997cc3ead5bdcb0e3ed14  /tmp/source37.patch.gz" | sha256sum -c -
          gzip -dc /tmp/source37.patch.gz > source37.patch
          unzip -t DongBaKe-source-36.zip
          mkdir buildsrc
          unzip -q DongBaKe-source-36.zip -d buildsrc
          patch --dry-run --batch --forward -p1 -d buildsrc < source37.patch
          patch --batch --forward -p1 -d buildsrc < source37.patch
          nl -ba buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt | sed -n '1765,1870p' | tee source37-mainactivity-context.txt
          grep -nE '^\+.*(context|thinking|prompt|log|val |var )' source37.patch | head -250 > source37-patch-relevant-lines.txt
          sha256sum source37.patch.gz source37.patch buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt > source37-inspection-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source37-patch-inspection
          path: |
            source37.patch
            source37.patch.gz
            source37-mainactivity-context.txt
            source37-patch-relevant-lines.txt
            source37-inspection-sha256.txt
          retention-days: 7
