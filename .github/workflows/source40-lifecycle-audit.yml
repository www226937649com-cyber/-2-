name: DongBaKe Source40 lifecycle and cache audit

on:
  push:
    branches:
      - work/source-37-context-logging
    paths:
      - '.github/workflows/source40-lifecycle-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v4

      - name: Reconstruct exact Source40 source without building APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/buildsrc" "$RUNNER_TEMP/source38-bundle" "$RUNNER_TEMP/source40"
          unzip -t DongBaKe-source-37.zip >/dev/null
          unzip -q DongBaKe-source-37.zip -d "$GITHUB_WORKSPACE/buildsrc"
          cat patches/source38-bundle-parts/part00.txt patches/source38-bundle-parts/part01a.txt patches/source38-bundle-parts/part01b.txt patches/source38-bundle-parts/part02a.txt patches/source38-bundle-parts/part02b.txt patches/source38-bundle-parts/part02c.txt patches/source38-bundle-parts/part02d.txt patches/source38-bundle-parts/part03.txt | tr -d '\r\n' > "$RUNNER_TEMP/source38-bundle.tar.gz.xz.b64"
          test "$(wc -c < "$RUNNER_TEMP/source38-bundle.tar.gz.xz.b64")" -eq 36136
          base64 --decode "$RUNNER_TEMP/source38-bundle.tar.gz.xz.b64" > "$RUNNER_TEMP/source38-bundle.tar.gz.xz"
          echo "e109a5ed216c2b5fa6fe77a2c6c613f85bb5c653e50e97a6c803c2606b771052  $RUNNER_TEMP/source38-bundle.tar.gz.xz" | sha256sum -c -
          xz -t "$RUNNER_TEMP/source38-bundle.tar.gz.xz"
          xz -dc "$RUNNER_TEMP/source38-bundle.tar.gz.xz" | tar -xz -C "$RUNNER_TEMP/source38-bundle"
          python3 "$RUNNER_TEMP/source38-bundle/apply_phase1.py" "$GITHUB_WORKSPACE/buildsrc"
          python3 "$RUNNER_TEMP/source38-bundle/finalize.py" "$GITHUB_WORKSPACE/buildsrc"
          python3 tools/patch_source38_casual_classifier.py "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt"
          cp "$RUNNER_TEMP/source38-bundle/java/AiToolRegistry.kt" buildsrc/app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt
          cp "$RUNNER_TEMP/source38-bundle/java/AiToolRegistryTest.kt" buildsrc/app/src/test/java/com/aiguanjia/app/AiToolRegistryTest.kt
          cp "$RUNNER_TEMP/source38-bundle"/tests/*.py buildsrc/tests/
          python3 tools/patch_source38_strict_tool_protocol.py "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt" "$GITHUB_WORKSPACE/buildsrc/app/src/test/java/com/aiguanjia/app/AiToolRegistryTest.kt" "$GITHUB_WORKSPACE/buildsrc/tests/test_progress_audit.py" "$GITHUB_WORKSPACE/buildsrc/tests/test_runtime_observability.py" "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt"
          python3 tools/fix_first_token_regression.py "$GITHUB_WORKSPACE/buildsrc/app/build.gradle.kts" "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/AiToolRegistry.kt" "$GITHUB_WORKSPACE/buildsrc/app/src/test/java/com/aiguanjia/app/AiToolRegistryTest.kt" "$GITHUB_WORKSPACE/buildsrc/app/src/main/java/com/aiguanjia/app/MainActivity.kt" "$GITHUB_WORKSPACE/buildsrc/tests" "$GITHUB_WORKSPACE/buildsrc/README.md"
          cat patches/source40-bundle/part*.txt | base64 --decode | gzip -dc > "$RUNNER_TEMP/source40/source40.patch"
          echo "231b29660383316017dea9c6dfd4d7315b75792926e4c9117d9bc65d157c73e2  $RUNNER_TEMP/source40/source40.patch" | sha256sum -c -
          cd "$GITHUB_WORKSPACE/buildsrc"
          patch -p1 --batch --fuzz=0 < "$RUNNER_TEMP/source40/source40.patch"
          cat "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part00.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part01.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part02.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part03.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part04.txt" "$GITHUB_WORKSPACE/patches/source40-bundle/source40-hotfix-part05.txt" > "$RUNNER_TEMP/source40/source40-hotfix.patch.gz.b64"
          echo "f5ea27036f2c6abb0092b08a0f8e1c8b8f54ac8a2416832ef991092cfbc46f8f  $RUNNER_TEMP/source40/source40-hotfix.patch.gz.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/source40/source40-hotfix.patch.gz.b64" > "$RUNNER_TEMP/source40/source40-hotfix.patch.gz"
          echo "741108a9fe9f7d3337ccd5331a023d61608e40fd69becaf2d83e93bff8feaf0f  $RUNNER_TEMP/source40/source40-hotfix.patch.gz" | sha256sum -c -
          gzip -dc "$RUNNER_TEMP/source40/source40-hotfix.patch.gz" > "$RUNNER_TEMP/source40/source40-hotfix.patch"
          echo "92d1b6f2858184eece11e1a7a6546c8ba66c3b14cff3e9d7126294e8eb30b321  $RUNNER_TEMP/source40/source40-hotfix.patch" | sha256sum -c -
          patch -p1 --batch --fuzz=0 < "$RUNNER_TEMP/source40/source40-hotfix.patch"
          grep -q 'applicationId = "com.aiguanjia.app"' app/build.gradle.kts
          grep -q 'versionCode = 40' app/build.gradle.kts
          echo 'Source40 source reconstructed with exact CI patch hashes.'

      - name: Audit model lifecycle, context reuse, logging and routing evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$GITHUB_WORKSPACE/buildsrc"
          REPORT="$GITHUB_WORKSPACE/source40-lifecycle-audit.txt"
          {
            echo "Source40 lifecycle/cache audit"
            echo "branch=$GITHUB_REF_NAME"
            echo "commit=$GITHUB_SHA"
            echo "version metadata:"
            grep -nE 'applicationId|versionCode|versionName' "$SRC/app/build.gradle.kts"
            echo
            echo "=== Model selection, persisted path, auto-load and lifecycle references ==="
            grep -nEi 'sharedpreferences|datastore|persist|auto.?load|model.?path|selected.?model|load.?model|unload.?model|oncreate|onresume|onstop|ondestroy|keepalive|model.?loaded' "$SRC/app/src/main/java/com/aiguanjia/app/MainActivity.kt" "$SRC/app/src/main/java/com/aiguanjia/app/NativeLlamaEngine.kt" "$SRC/app/src/main/java/com/aiguanjia/app/InferenceKeepAliveService.kt" | head -n 240 || true
            echo
            echo "=== Cross-turn KV/context/prefix reuse references ==="
            grep -nEi 'kv.?cache|prefix.?cache|cache.?hit|reuse|reused|common.?prefix|context.?state|context.?cache|native.*state|state.*native|token.*match|matched.?token|saved.?token|reuse.*token|token.*reuse|prefill|first.?token' "$SRC/app/src/main/java/com/aiguanjia/app/MainActivity.kt" "$SRC/app/src/main/java/com/aiguanjia/app/NativeLlamaEngine.kt" "$SRC/app/src/main/cpp/dongbake_llama_jni.cpp" "$SRC/app/src/main/java/com/aiguanjia/app/AppDiagnostics.kt" | head -n 280 || true
            echo
            echo "=== Run log toggle and metrics ==="
            grep -nEi 'verbose.?logging|run.?log|logging.?enabled|prefill|first.?token|decode|tool.?duration|cache.?hit|reused.?tokens|context.?length|thinking.?mode|backend' "$SRC/app/src/main/java/com/aiguanjia/app/MainActivity.kt" "$SRC/app/src/main/java/com/aiguanjia/app/NativeLlamaEngine.kt" "$SRC/app/src/main/java/com/aiguanjia/app/AppDiagnostics.kt" | head -n 280 || true
            echo
            echo "=== Embedding router declarations and model behavior ==="
            grep -nE '^(class|object|data class|enum class|    fun |    suspend fun |    private fun |    internal fun)|mean|pool|attention|mask|fallback|threshold|similarity|onnx|tokenizer' "$SRC/app/src/main/java/com/aiguanjia/app/LocalEmbeddingRouter.kt" | head -n 220 || true
            echo
            echo "=== Sandbox restrictions ==="
            grep -nEi 'timeout|step|instruction|import|open\(|file|socket|subprocess|eval|exec|memory|recursion|factorial|allowed|blocked' "$SRC/app/src/main/python/code_sandbox.py" | head -n 180 || true
            echo
            echo "=== Context mode and reload indication ==="
            grep -nEi 'context.*(quick|balanced|deep)|quick.*context|balanced.*context|deep.*context|reload.*(context|model)|needs.?reload|effective.?context|native.?context|soft.?limit|context.?limit' "$SRC/app/src/main/java/com/aiguanjia/app/MainActivity.kt" "$SRC/app/src/main/java/com/aiguanjia/app/NativeLlamaEngine.kt" | head -n 220 || true
          } | tee "$REPORT"
          mkdir -p "$SRC/build/source-40-audit"
          cp "$REPORT" "$SRC/build/source-40-audit/"
          cp "$SRC/app/src/main/java/com/aiguanjia/app/LocalEmbeddingRouter.kt" "$SRC/build/source-40-audit/"
          cp "$SRC/app/src/main/java/com/aiguanjia/app/NativeLlamaEngine.kt" "$SRC/build/source-40-audit/"
          cp "$SRC/app/src/main/java/com/aiguanjia/app/AppDiagnostics.kt" "$SRC/build/source-40-audit/"
          cp "$SRC/app/src/main/python/code_sandbox.py" "$SRC/build/source-40-audit/"
          echo "Audit snapshot generated. This checks source structure; it does not prove real-device cache hits or reopen behavior."

      - name: Upload compact audit snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DongBaKe-source-40-lifecycle-audit-${{ github.run_number }}
          path: |
            source40-lifecycle-audit.txt
            buildsrc/build/source-40-audit/**
          if-no-files-found: warn
          retention-days: 14
